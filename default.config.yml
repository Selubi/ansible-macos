---
#####################
# Brew and App Store
#####################

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  - bat
  - curl
  - fzf
  - git
  - gh
  - jq
  - starship
  - uv
  - wget
  - zsh
homebrew_upgrade_all_packages: true
homebrew_taps: []

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
#  - 1password
  - font-fira-code-nerd-font
  - ghostty
  - visual-studio-code
  - zen-browser

# See `geerlingguy.mac.mas` role documentation for usage instructions.
mas_installed_apps: []
mas_email: ""
mas_password: ""

####################################
# Dotfiles and system settings
####################################
configure_dotfiles: true

dotfiles_repo: https://github.com/Selubi/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Repositories/dotfiles
dotfiles_repo_version: master # Replace with your default branch
dotfiles_files:
  - .zshrc
  - .osx
  - .zprofile

configure_osx: true
# osx_script: "~/.osx --no-restart"
osx_script: "~/.osx"

############ UNCHARTED AREA AHEAD ############
configure_terminal: false

configure_sublime: false
# Set to 'true' to configure the Dock via dockutil.
configure_dock: false
dockitems_remove: []
# - Launchpad
# - TV
# - Podcasts
# - 'App Store'
dockitems_persist: []
# - name: "Sublime Text"
#   path: "/Applications/Sublime Text.app/"
#   pos: 5

configure_sudoers: false
sudoers_custom_config: ""
